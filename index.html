		<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --color-text: #ffffff;
  --color-text-muted: rgba(255, 255, 255, 0.55);
  --font-display: 'Canela', 'Freight Display', 'Tiempos Headline', 'Playfair Display', Georgia, serif;
  --font-body: 'Signifier', 'Freight Text', 'Lyon Text', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --spacing-unit: 8px;
  --max-width: 580px;
}
body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.75;
  color: var(--color-text);
  background: #000;
  padding: calc(var(--spacing-unit) * 12) calc(var(--spacing-unit) * 4);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  position: relative;
  overflow-x: hidden;
  min-height: 100vh;
}
#video-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: -2;
  will-change: transform;
  animation: slow-zoom 30s ease-in-out infinite alternate;
}
@keyframes slow-zoom {
  0%   { transform: scale(1.0); }
  100% { transform: scale(1.08); }
}
#video-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.3);
  z-index: -1;
  pointer-events: none;
  transition: background 0.9s cubic-bezier(0.4, 0, 0.2, 1);
}
body:hover #video-overlay { background: rgba(0, 0, 0, 0.52); }
h1 {
  font-family: var(--font-display);
  font-size: 2.75rem;
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: calc(var(--spacing-unit) * 2);
}
ul { list-style: none; margin: calc(var(--spacing-unit) * 6) 0; padding: 0; }
li {
  margin-bottom: calc(var(--spacing-unit) * 3);
  font-family: var(--font-sans);
  font-size: 0.9375rem;
  font-weight: 400;
  letter-spacing: 0.015em;
}
a {
  color: var(--color-text);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  padding-bottom: 1px;
}
a:hover { border-bottom-color: var(--color-text); }
footer {
  margin-top: calc(var(--spacing-unit) * 20);
  font-family: var(--font-sans);
  font-size: 0.8125rem;
  color: var(--color-text-muted);
  letter-spacing: 0.02em;
}
.center { max-width: var(--max-width); margin: 0 auto; }
		</style>
		<script>
			var slugs = [
				'IMG_0144', 'IMG_0484', 'IMG_1132', 'IMG_1186', 'IMG_1226',
				'IMG_1541', 'IMG_1879', 'IMG_1880', 'IMG_1997', 'IMG_2089',
				'IMG_2480', 'IMG_2482', 'IMG_3545', 'IMG_3648', 'IMG_3952',
				'IMG_5160', 'IMG_5832', 'IMG_6589', 'IMG_6640', 'IMG_7042',
				'IMG_7642', 'IMG_8248', 'IMG_8396', 'IMG_9334', 'IMG_9362',
				'IMG_9584'
			];

			var HISTORY_SIZE = 3;

			function wander() {
				// Read recent history from sessionStorage, fail silently
				var recent = [];
				try {
					var stored = sessionStorage.getItem('_vbg_recent');
					var parsed = JSON.parse(stored);
					if (Array.isArray(parsed)) recent = parsed;
				} catch(e) {}

				// Pick from slugs not seen recently; fall back to full list if exhausted
				var pool = slugs.filter(function(s) { return recent.indexOf(s) === -1; });
				if (!pool.length) pool = slugs;
				var slug = pool[Math.floor(Math.random() * pool.length)];

				// Persist updated history, fail silently
				try {
					recent.push(slug);
					if (recent.length > HISTORY_SIZE) recent = recent.slice(-HISTORY_SIZE);
					sessionStorage.setItem('_vbg_recent', JSON.stringify(recent));
				} catch(e) {}

				var suffix = window.innerWidth < 768 ? '-mobile' : '-desktop';
				var src = 'assets/videos/' + slug + suffix + '.mp4';
				var poster = 'assets/videos/' + slug + suffix + '-poster.jpg';

				var v = document.getElementById('video-bg');
				if (v) {
					v.poster = poster;
					v.src = src;
					v.load();
					v.play();
				} else {
					// Called before DOM ready (initial load) — stash for later
					window._videoBgSrc = src;
					window._videoBgPoster = poster;
					var link = document.createElement('link');
					link.rel = 'preload'; link.as = 'video';
					link.href = src; link.type = 'video/mp4';
					document.head.appendChild(link);
				}
			}

			wander();
		</script>

					<li><a target="_blank" href="mailto:get@cneale.com">Contact</a></li>
					<li><a href="#" onclick="wander(); return false;">Wander</a></li>
				</ul>
			</div>
		</div>
		<footer class="center">
			  &#xA9; 2026 Christopher Neale.
		</footer>
		<script>
			var v = document.getElementById('video-bg');
			v.poster = window._videoBgPoster;
			v.src = window._videoBgSrc;
			v.load();
		</script>
	</body>
